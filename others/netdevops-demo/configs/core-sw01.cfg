!
hostname core-sw01
!
enable password Cisco123
!
no service password-encryption
!
username netadmin privilege 15 secret 5 $1$abcd$xyz
!
ip domain-name lab.example.net
!
snmp-server community public RO
snmp-server community private RW
!
line vty 0 4
 transport input telnet ssh
 login local
!
interface Vlan10
 description MGMT
 ip address 10.50.0.2 255.255.255.192
!
interface GigabitEthernet0/1
 description Uplink-to-edge-rtr01
 switchport mode trunk
!
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 20
!
interface GigabitEthernet0/3
 shutdown
!
router bgp 65010
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.5 remote-as 65020
!
ntp server 10.0.0.123
!
end
