!
hostname core-sw02
!
service password-encryption
!
enable secret 5 $1$wxyz$abc123
!
username netadmin privilege 15 secret 5 $1$defg$uvw
!
ip domain-name lab.example.net
!
snmp-server community S3cur3Str1ng RO
!
line vty 0 4
 transport input ssh
 login local
!
interface Vlan10
 description MGMT
 ip address 10.50.0.3 255.255.255.192
!
interface GigabitEthernet0/1
 description Uplink-to-edge-rtr02
 switchport mode trunk
!
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 20
!
interface GigabitEthernet0/3
 switchport mode access
 switchport access vlan 30
!
router bgp 65010
 neighbor 10.0.0.9 remote-as 65000
!
ntp server 10.0.0.123
!
end
